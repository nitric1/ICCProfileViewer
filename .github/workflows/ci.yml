name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 build and test
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Check out repository and LittleCMS
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build LittleCMS
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudioPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $visualStudioPath) {
            throw 'Visual Studio with the VC++ x64 tools was not found.'
          }

          $developerShell = Join-Path $visualStudioPath `
            'Common7\Tools\Launch-VsDevShell.ps1'
          & $developerShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not $env:VSINSTALLDIR) {
            throw 'Visual Studio Developer PowerShell initialization failed.'
          }

          & .\build-lcms.cmd Release x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Restore
        run: dotnet restore ICCProfileViewer.slnx

      - name: Test
        run: >-
          dotnet test ICCProfileViewer.slnx
          -c Release
          --no-restore
          -p:UseSharedCompilation=false
          -m:1
